<title>Klientská zóna – Lukáš Rybčák</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* VOICE calm, exact, like a shipped Apple app: lots of air, few colours
   IDEA a producer's call sheet: what goes out when, what is ready, when to shoot next
   PICTURE per client a week-by-week publishing calendar where ready slots fill and the gap shows when to film
   COLOUR Apple grey ground #f5f5f7, white cards, brand petrol #004A49 for identity and actions, teal #008F84 for data
   TYPE Inter for everything, Montserrat only in the SEBASTIAN CAKL wordmark
   LAYOUT laptop: top bar with centred tabs, two columns; phone: one column, bottom tab bar; client zone is one calm report */
:root{color-scheme:light dark;--bg:light-dark(#f5f5f7,#000);--card:light-dark(#fff,#1c1c1e);--card2:light-dark(#f9f9fb,#232325);--line:light-dark(#e8e8ed,#2c2c2e);--ink:light-dark(#1d1d1f,#f5f5f7);--mute:light-dark(#6e6e73,#98989d);--faint:light-dark(#a1a1a6,#636366);--brand:light-dark(#004A49,#4cc2b5);--brandInk:light-dark(#fff,#002625);--brandBg:light-dark(#e7f1f0,#10302e);--mark:light-dark(#008F84,#1FA89B);--ok:light-dark(#1a7f45,#30d158);--okBg:light-dark(#e6f4ea,#11301b);--warn:light-dark(#b25000,#ffa94d);--warnBg:light-dark(#fff1e0,#3a2610);--bad:light-dark(#c0362c,#ff6961);--badBg:light-dark(#fdecea,#3b1614);--sh:0 1px 2px rgb(0 0 0/.04),0 6px 24px rgb(0 0 0/.05)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3{margin:0;letter-spacing:-.022em;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(30px,4.2vw,44px);font-weight:700}
h2{font-size:21px;font-weight:650}
h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
p{margin:0}
a{color:var(--brand)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--mark) 60%,transparent);outline-offset:2px;border-radius:10px}
.muted{color:var(--mute)}.small{font-size:14px}.tiny{font-size:13px}.nowrap{white-space:nowrap}.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.top .in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px max(16px,3vw);min-height:60px}
.logo{display:flex;align-items:center;gap:10px;color:var(--brand);text-decoration:none;flex:none}
.logo svg{width:30px;height:26px;display:block}
.wm{font:400 13.5px/1 Montserrat,Inter,sans-serif;letter-spacing:.09em;color:var(--brand);white-space:nowrap}
.wm b{font-weight:700;margin-left:.35em}
.tabs{display:flex;gap:2px;margin:0 auto;background:color-mix(in srgb,var(--ink) 6%,transparent);padding:3px;border-radius:12px}
.tab{border:0;background:none;padding:7px 15px;border-radius:9px;font-size:14px;font-weight:500;color:var(--mute);min-height:36px;white-space:nowrap}
.tab[aria-current=page]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.1)}
.sync{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mute);white-space:nowrap;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
main{max-width:1200px;margin:0 auto;padding:clamp(22px,3.5vw,44px) max(16px,3vw) 120px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.sub{color:var(--mute);font-size:17px;margin-top:8px}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:grid;gap:20px}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--sh)}
.card.flat{background:var(--card2);box-shadow:none;border:1px solid var(--line)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--card2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brandInk)}
.btn.soft{background:var(--brandBg);border-color:transparent;color:var(--brand)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px;border-radius:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--brandBg);color:var(--brand);flex:none;letter-spacing:.02em}
.av.sm{width:28px;height:28px;font-size:11px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.5}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-vydano{background:var(--okBg);color:var(--ok)}.c-zpracovano{background:var(--brandBg);color:var(--brand)}.c-natoceno{background:var(--warnBg);color:var(--warn)}.c-napad,.c-ai{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--mute)}.c-chybi{background:var(--badBg);color:var(--bad)}
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0;padding-top:2px}
.grow{flex:1}
.t2{font-size:13.5px;color:var(--mute);margin-top:1px;overflow-wrap:anywhere}
.chead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start}
.chead .act{text-align:right;display:grid;gap:10px;justify-items:end}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 7%,transparent);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--mark)}
.bar i.lo{background:var(--bad)}.bar i.mid{background:var(--warn)}
.wkgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 9px;min-height:118px}
.day.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.day .dn{font-size:12.5px;color:var(--mute);font-weight:600}
.day .dd{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.slot{display:block;border-radius:9px;padding:5px 7px;margin-top:5px;font-size:12px;line-height:1.3;background:var(--card);border:1px solid var(--line)}
.slot b{display:block;font-size:11px;font-weight:700;color:var(--mute)}
.slot.done{background:var(--okBg);border-color:transparent}.slot.done b{color:var(--ok)}
.slot.gap{background:var(--badBg);border-color:transparent;color:var(--bad)}.slot.gap b{color:var(--bad)}
.slot.ai{color:var(--mute)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shoot{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.shoot:first-child,.frow:first-child{border-top:0;padding-top:0}
.frow{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
.frow b{width:84px;flex:none;white-space:nowrap;color:var(--ink);font-weight:600}
.cal{width:62px;border-radius:14px;overflow:hidden;text-align:center;background:var(--card2);border:1px solid var(--line)}
.cal span{display:block;background:var(--brand);color:var(--brandInk);font-size:11px;font-weight:700;padding:2px 0}
.cal b{display:block;font-size:22px;letter-spacing:-.02em;padding:3px 0 1px}
.cal i{display:block;font-style:normal;font-size:11px;color:var(--mute);padding-bottom:4px}
.kpi{font-size:clamp(34px,5vw,52px);font-weight:700;letter-spacing:-.035em;line-height:1}
.pill-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 18px}
.pill-tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;font-size:14px;font-weight:600;min-height:38px;color:var(--mute)}
.pill-tabs button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wk{margin-top:18px}
.wk h3{font-size:14px;color:var(--mute);font-weight:600;margin-bottom:6px}
.prow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow .pd{font-weight:600;font-size:14px}
.prow .pd i{display:block;font-style:normal;color:var(--mute);font-weight:500;font-size:12.5px}
select.st{appearance:none;border:0;border-radius:999px;padding:5px 26px 5px 12px;font-size:12.5px;font-weight:600;min-height:32px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.field{display:grid;gap:6px;margin-top:14px}
.field label{font-size:14px;font-weight:600}
.field input,.field select{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px;width:100%}
.hint{font-size:13px;color:var(--mute)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.tog:first-of-type{border-top:0}
.sw{appearance:none;width:50px;height:30px;border-radius:15px;background:color-mix(in srgb,var(--ink) 16%,transparent);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.3);transition:transform .2s}
.sw:checked{background:var(--ok)}.sw:checked::after{transform:translateX(20px)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13px;color:var(--mute);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.scroll{overflow-x:auto}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.note:first-child{border-top:0;padding-top:0}
.ni{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:700;margin-top:1px}
.ni.ok{background:var(--okBg);color:var(--ok)}.ni.warn{background:var(--warnBg);color:var(--warn)}.ni.info{background:var(--brandBg);color:var(--brand)}
.tabbar{display:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);opacity:0;background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--bg);border-radius:14px;padding:11px 16px;font-size:14px;font-weight:500;transition:all .25s;z-index:70;pointer-events:none;max-width:min(420px,92vw);box-shadow:0 10px 30px rgb(0 0 0/.2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.link{pointer-events:auto}.toast a{color:inherit;font-weight:700;text-decoration:underline;margin-left:4px;white-space:nowrap}
.st.ro{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;min-height:32px;white-space:nowrap}.st.ro:not([class*="c-"]){background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--mute)}
.roedit{margin-left:6px;font-size:13px;font-weight:600;color:var(--brand);background:var(--brandBg);border-radius:999px;padding:6px 12px;text-decoration:none;white-space:nowrap}
html.ro #addf,html.ro #reff,html.ro #discf,html.ro #shf,html.ro #root form button,html.ro [data-ref-end],html.ro [data-ref-undo],html.ro [data-disc-del],html.ro [data-pub],html.ro [data-approve],html.ro [data-paid],html.ro [data-ok-shoot],html.ro [data-del-shoot]{display:none!important}
@media(max-width:600px){html.ro .sync .lbl{display:inline;font-size:12px}html.ro .roedit{padding:6px 11px}}
/* zone */
.zhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;align-items:stretch}
.big{font-size:clamp(54px,9vw,96px);font-weight:700;letter-spacing:-.045em;line-height:.95}
.delta{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-weight:600;font-size:14px;background:var(--okBg);color:var(--ok)}
.delta.down{background:var(--badBg);color:var(--bad)}.nl{display:inline-flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.nl a{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 10px;min-height:30px;background:var(--card)}.nl a:hover{background:var(--card2)}.nl i{width:7px;height:7px;border-radius:2px}.xpin{width:110px;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;background:var(--card);color:var(--ink);text-align:right}.rk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}.rk>div{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:18px}.rk .tag{font-size:12.5px;font-weight:600;color:var(--mute)}.rk .big2{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:6px 0 8px;color:var(--brand)}.rk p{font-size:14px;line-height:1.55;color:var(--ink)}.rl{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px}.rl li{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.55}.rl b{display:block;font-size:14px}.rl .ic{flex:none;width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--mark) 14%,transparent);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px}.ex{margin-top:18px;border-left:3px solid var(--brand);background:var(--card2);border-radius:0 14px 14px 0;padding:14px 18px;font-size:14px;line-height:1.55}.mine{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}@media(max-width:760px){.rk{grid-template-columns:minmax(0,1fr)}.rl{grid-template-columns:minmax(0,1fr)}}.nlw{margin-top:7px}@media(max-width:600px){.tv li{flex-wrap:wrap;row-gap:6px}.tv li>.grow{flex:1 1 calc(100% - 44px)}.list>li:has(.tth) .grow{flex-basis:calc(100% - 96px)}.tth{width:30px;height:53px}.tv li>b.num{margin-left:36px;margin-right:auto}}.nlw .nl{justify-content:flex-start}.nets.five{grid-template-columns:repeat(3,minmax(0,1fr))}.profs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}@media(max-width:600px){.nets.five{grid-template-columns:repeat(2,minmax(0,1fr))}}.c-bonus{background:color-mix(in srgb,var(--mark) 14%,transparent);color:var(--brand)}.bgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:16px}.bbox{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:16px 18px}.lab2{font-size:13px;font-weight:600;color:var(--mute)}.kpi2{font-size:34px;font-weight:700;letter-spacing:-.03em;margin:4px 0 6px}.rules{margin-top:16px}.rules summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--brand);min-height:44px;display:flex;align-items:center}.rules p{font-size:14px;color:var(--mute);line-height:1.55;max-width:70ch}.pages{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,280px);gap:14px;overflow-x:auto;padding:4px 2px 10px;margin-top:16px;scroll-snap-type:x mandatory}.pages a{scroll-snap-align:start;display:block;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}.pages img{display:block;width:100%;height:auto}.bt{width:100%;border-collapse:collapse;font-size:14px}.bt th{text-align:left;font-size:12.5px;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.bt td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}.bt .r{text-align:right}@media(max-width:600px){.bgrid{grid-template-columns:minmax(0,1fr)}}.delta.flat{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--mute)}.frow .busy{color:var(--warn)}.net.off .v{color:var(--faint)}
.nets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.nets.one{grid-template-columns:1fr;height:100%;grid-auto-rows:1fr}.nets.one .net{display:grid;grid-template-columns:minmax(0,1fr) auto;align-content:center;column-gap:16px}.nets.one .net .v{grid-row:1/span 3;grid-column:2;align-self:center;font-size:34px}
.net{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.net .nm{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--mute)}
.net .nm i{width:9px;height:9px;border-radius:3px;flex:none}
.net .v{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:6px}
.net .p{font-size:13px;color:var(--mute)}
.fig{position:relative;height:300px;margin-top:6px}
.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig svg text{paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;border-radius:10px;padding:7px 10px;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:3}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:3px;border-radius:2px;background:var(--mark)}
.legend i.prev{background:none;border-top:2px dashed var(--faint);height:0}
.inv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.qr{width:184px;height:184px;background:#fff;border-radius:18px;padding:12px;position:relative;border:1px solid var(--line)}
.qr svg{width:100%;height:100%;display:block}.qr.sm{width:128px;height:128px;padding:9px;border-radius:14px;flex:none}.approw{display:flex;gap:16px;align-items:flex-start;margin-top:10px}@media(max-width:600px){.approw{flex-direction:column}}
.qr .rib{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:var(--warn);color:#fff;font-size:11.5px;font-weight:700;border-radius:7px;padding:2px 8px;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgb(0 0 0/.4);backdrop-filter:blur(6px);display:none;place-items:center;z-index:60;padding:16px;overflow:auto}
.ov.on{display:grid}
.sheet{background:#fff;color:#1d1d1f;max-width:780px;width:100%;border-radius:20px;padding:clamp(20px,4vw,44px);box-shadow:0 24px 70px rgb(0 0 0/.3)}
.sheet .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:22px;font-size:14px;line-height:1.55}
.sheet .lab{font-size:12px;color:#6e6e73;font-weight:600;margin-bottom:2px}
.sheet td,.sheet th{border-color:#e8e8ed;color:#1d1d1f}
.sheet .tot{font-size:30px;font-weight:700;letter-spacing:-.03em;color:#004A49}
.zbar{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;font-size:14px}
@media(max-width:980px){.grid,.hero{grid-template-columns:minmax(0,1fr)}.tabs{display:none}.sync{margin-left:auto}
.tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--faint);padding:4px 0;min-height:48px}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current=page]{color:var(--brand)}
.wkgrid{grid-template-columns:minmax(0,1fr);gap:6px}.day{min-height:0;display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;align-items:start;padding:9px 10px}.day .dd{margin:0;font-size:18px}.day .slots{display:flex;flex-wrap:wrap;gap:5px}.slot{margin:0}.day:not(:has(.slot)){display:none}}
@media(max-width:600px){.chead{grid-template-columns:auto minmax(0,1fr)}.chead .act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;align-items:center;text-align:left}.chead .act>*{max-width:100%}.card{padding:18px;border-radius:20px}.wm{display:none}.sync .lbl{display:none}.inv{grid-template-columns:minmax(0,1fr)}.qr{margin:auto}.nets{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.net .v{font-size:22px}.prow{grid-template-columns:58px minmax(0,1fr)}.prow>:last-child{grid-column:2;justify-self:start}.shoot{grid-template-columns:62px minmax(0,1fr)}.shoot>:last-child{grid-column:2;justify-self:start}
.mtable thead{display:none}.mtable tr{display:grid;padding:10px 0;border-bottom:1px solid var(--line)}.mtable td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0}.mtable td::before{content:attr(data-l);color:var(--mute);font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* splash */
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg);transition:opacity .45s ease,visibility .45s}
#splash.done{opacity:0;visibility:hidden}
.spc{display:grid;justify-items:center;gap:18px;color:var(--brand);animation:spIn .7s cubic-bezier(.2,.7,.2,1) both}
.spm{width:74px;height:62px;display:block}
.spw{font:400 14px/1 Montserrat,Inter,sans-serif;letter-spacing:.22em;color:var(--brand)}.spw b{font-weight:700;margin-left:.4em}
.spb{width:120px;height:2px;border-radius:2px;background:color-mix(in srgb,var(--brand) 14%,transparent);overflow:hidden;margin-top:6px}
.spb i{display:block;width:40%;height:100%;border-radius:2px;background:var(--brand);animation:spBar 1.1s ease-in-out infinite}
@keyframes spIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes spBar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
/* ikony sítí */
.ni{display:inline-grid;place-items:center;width:18px;height:18px;flex:none;border-radius:5px;overflow:hidden;vertical-align:-4px}
.ni svg{display:block;width:100%;height:100%}
.ni-ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%)}.ni-ig svg{width:68%;height:68%;fill:#fff}
.ni-fb{border-radius:50%;background:#fff}.ni-fb svg{fill:#0866ff}
.ni-tt{background:#000}.ni-tt svg{width:70%;height:70%}
.ni-yt{border-radius:0;background:none;width:21px}
.net .nm .ni{width:20px;height:20px}.net .nm .ni-yt{width:23px}
.nl a .ni{width:16px;height:16px;border-radius:4px}.nl a .ni-fb{border-radius:50%}.nl a .ni-yt{width:19px;border-radius:0}
.profs a .ni{width:16px;height:16px}
/* kalendář */
.kal{margin-top:20px}
.kalh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kalh h2{font-size:clamp(24px,3vw,30px);font-weight:700;letter-spacing:-.03em}.kalh h2 span{font-weight:400;color:var(--mute);margin-left:.25em}
.kaln{display:flex;gap:6px}
.kaln button{height:34px;min-width:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;padding:0 12px}
.kaln button:hover:not(:disabled){background:var(--card2)}.kaln button:disabled{opacity:.35;cursor:default}
.kalw{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:16px;font-size:12px;font-weight:600;color:var(--mute);text-align:right;padding:0 10px 6px}
.kalg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:2px}
.kd{position:relative;min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px 7px;display:flex;flex-direction:column;gap:3px}
.kd.we{background:color-mix(in srgb,var(--ink) 2.5%,transparent)}
.kdn{align-self:flex-end;border:0;background:none;padding:0;font-size:13px;font-weight:500;cursor:default;color:var(--ink)}
.kdn span{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:13px;padding:0 7px}
.kd.out .kdn span{color:var(--faint)}
.kd.today .kdn span{background:#ff3b30;color:#fff;font-weight:700}
.kev{display:flex;flex-direction:column;gap:3px}
.ke{display:flex;align-items:center;gap:6px;width:100%;border:0;border-radius:7px;padding:3px 6px 3px 3px;font-size:12px;font-weight:600;text-align:left;line-height:1.25;color:var(--ink);transition:background .12s}
.ke span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ke img{width:21px;height:30px;border-radius:4px;object-fit:cover;flex:none;background:var(--card2)}
.ke i{width:7px;height:7px;border-radius:50%;flex:none;margin:0 2px 0 4px}
.ke.done{background:color-mix(in srgb,var(--mark) 13%,transparent)}.ke.done:hover,.ke.done.hov{background:color-mix(in srgb,var(--mark) 24%,transparent)}
.ke.done i{background:var(--mark)}
.ke.plan{background:none;color:var(--mute);font-weight:500;box-shadow:inset 0 0 0 1px var(--line);padding:4px 6px 4px 3px}.ke.plan i{background:var(--faint)}.ke.plan:hover{background:var(--card2)}
.ke.shoot{background:color-mix(in srgb,#ff9500 16%,transparent)}.ke.shoot i{background:#ff9500}
.tth{width:34px;height:60px;border-radius:7px;object-fit:cover;flex:none;background:var(--card2)}.kdots{display:none}.kday{display:none}.khm{display:none}
.kalf{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--mute)}
.klg{display:flex;gap:14px;flex-wrap:wrap}.klg span{display:inline-flex;align-items:center;gap:6px}.klg i{width:9px;height:9px;border-radius:50%}
.klg .done{background:var(--mark)}.klg .plan{box-shadow:inset 0 0 0 1.5px var(--faint)}.klg .shoot{background:#ff9500}
.knext b{color:var(--ink)}
.kday h3{font-size:15px;margin-bottom:10px}
.kdi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--card2);border-radius:14px;padding:8px 12px 8px 8px;margin-bottom:8px;color:var(--ink)}
.kdi img,.kdi .ph{width:46px;height:80px;border-radius:9px;object-fit:cover;flex:none;background:var(--card)}
.kdi .ph{display:grid;place-items:center;color:var(--faint);font-size:11px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.kdi.shoot .ph{background:color-mix(in srgb,#ff9500 16%,transparent);color:#c26a00;box-shadow:none}
.kdi b{display:block;font-size:14.5px;line-height:1.3}.kdi .t2{margin-top:2px}
.kdi .tot{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
@media(max-width:700px){
.kalw{text-align:center;padding:0 0 6px}
.kalg{border-left:0}
.kd{min-height:54px;border-right:0;padding:0}
.kd.we{background:none}
.kdn{position:absolute;inset:0;cursor:pointer;display:flex;justify-content:center;align-items:flex-start;padding-top:5px;align-self:auto}
.kdn span{font-size:15px}
.kd.sel .kdn span{background:var(--ink);color:var(--bg);font-weight:700}.kd.today.sel .kdn span{background:#ff3b30;color:#fff}
.kev{display:none}
.kdots{display:flex;gap:3px;position:absolute;bottom:9px;left:0;right:0;justify-content:center;pointer-events:none}
.kdots i{width:5px;height:5px;border-radius:50%;background:var(--mark)}.kdots i.plan{background:none;box-shadow:inset 0 0 0 1px var(--faint)}.kdots i.shoot{background:#ff9500}
.kday{display:block;margin-top:16px}.khd{display:none}.khm{display:block}
}
/* detail příspěvku */
.pop{position:fixed;z-index:70;width:372px;max-width:calc(100vw - 24px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 22px 60px rgb(0 0 0/.22);padding:14px;opacity:0;transform:scale(.96);pointer-events:none;transition:opacity .14s,transform .14s;top:0;left:0}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.evc{display:grid;grid-template-columns:124px minmax(0,1fr);gap:14px;align-items:start}
.evt{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px;background:var(--card2);display:block}
.evt.ph{display:grid;place-items:center;color:var(--faint);font-size:12px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line);text-align:center;padding:8px}
.evt.ph.shoot{background:color-mix(in srgb,#ff9500 14%,transparent);color:#c26a00;box-shadow:none}
.evd{font-size:12.5px;font-weight:600;color:var(--mute)}
.evc h3{margin-top:4px;font-size:17px;line-height:1.25}
.evc .t2{margin-top:3px}
.evv{display:grid;gap:7px;margin-top:12px}
.evv div{display:flex;align-items:center;gap:8px;font-size:13.5px}.evv b{margin-left:auto;font-variant-numeric:tabular-nums}
.evv .sum{border-top:1px solid var(--line);padding-top:7px;font-weight:600}
.evl{margin-top:12px}.evl .nl{justify-content:flex-start}
.sheet.sm{background:var(--card);color:var(--ink);max-width:620px}
.sheet.sm .evc{grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:22px}
.sheet.sm .evc h3{font-size:22px}
@media(max-width:560px){.sheet.sm .evc{grid-template-columns:120px minmax(0,1fr);gap:14px}.sheet.sm .evc h3{font-size:18px}}
@media(prefers-reduced-motion:reduce){.spc,.spb i{animation:none}.pop{transition:none}}
</style>
</head>

  const shoots='<div class="card"><div class="ch"><h2>Natáčení</h2><button class="btn sm" data-go="natoceni">Kalendář</button></div>'+sp.slice(0,3).map(s=>'<div class="shoot"><div class="cal"><span>'+DN[s.date.getDay()]+'</span><b>'+s.date.getDate()+'</b><i>'+MG[s.date.getMonth()].slice(0,3)+'</i></div><div><b>'+esc(s.c.name)+'</b><div class="t2">'+(s.status==='ok'?'domluveno'+calNote(s):'návrh'+(s.alt?' · víkend, čtvrtky jsou obsazené':''))+' · natočit aspoň '+s.c.filmPW*4+' videí</div></div>'+(s.status==='ok'?chip('vydano','Domluveno'):RO?chip('natoceno','Návrh'):'<button class="btn sm soft" data-ok-shoot="'+s.c.id+'|'+iso(s.date)+'">Potvrdit</button>')+'</div>').join('')+'</div>';
  const sumOf=c=>{const n=c.stats.nets.filter(x=>x.views),t=n.reduce((a,x)=>a+x.views[0],0),pv=n.reduce((a,x)=>a+x.views[1],0);return{t,pv,pc:pv?Math.round((t-pv)/pv*100):null}};

  const res=rs.length?'<div class="card"><div class="ch"><h2>Výsledky</h2><span class="muted small">videa z '+esc(inMonth(rs[0].c.stats.monthName))+' · k '+rs[0].c.stats.through+'. '+MG[Math.max(0,MN.indexOf(rs[0].c.stats.monthName))]+'</span></div>'+rs.map(({c,t,pc},k)=>'<div class="row between" style="'+(k?'margin-top:12px;padding-top:12px;border-top:1px solid var(--line)':'margin-top:4px')+'"><button class="btn sm" style="border:0;background:none;padding:0;min-height:0" data-go="zona-'+c.id+'"><b>'+esc(c.name)+'</b></button><span class="small nowrap"><b class="num" style="font-size:'+(k?'15px':'22px')+'">'+fmt(t)+'</b> <span class="'+(pc!=null&&pc>=0?'delta':'muted')+'" style="font-size:12.5px'+(pc!=null&&pc>=0?';padding:2px 8px':'')+'">'+(pc==null?'nový účet':(pc>=0?'+':'−')+fmt(Math.abs(pc))+' %')+'</span></span></div>').join('')+'<p class="hint" style="margin-top:12px">Počítadla přímo ze sítí, součet všech sítí klienta.</p></div>':'';
  const chk='<div class="card"><div class="ch"><h2>Denní kontrola</h2><span class="muted small">'+checkAt()+'</span></div>'+D.check.items.map(n=>{const c=cs.find(x=>x.id===n.c);return'<div class="note"><span class="ni '+n.k+'">'+(n.k==='ok'?'✓':n.k==='warn'?'!':'i')+'</span><div><b class="small">'+(c?esc(c.name)+': ':'')+esc(n.t)+'</b><div class="t2">'+esc(n.b)+'</div></div></div>'}).join('')+'</div>';
  const first=todayRows.find(r=>r.r.kind==='plan');
  return'<div class="head"><div><h1>'+greeting()+', Sebiku</h1><p class="sub">'+(first?'Dnes vychází „'+esc(first.r.it.t)+'“ ('+esc(first.c.name)+'). ':'Dnes nic nevychází. ')+'Další natáčení '+(nextShoot?dl(nextShoot.date)+' ('+esc(nextShoot.c.name)+')':'zatím není potřeba')+'.</p></div></div><div class="grid"><div class="stack">'+today+week+stock+'</div><div class="stack">'+shoots+res+chk+'</div></div>'}

function headBonus(c){const b=bonusOf(c.id),by=refInfo(c).by,ref=by&&C(by);return(b.refs.length?chip('bonus','Bonus '+b.perMonth+'/měs · '+b.monthName):'')+(b.ext?chip('bonus','Rozšíření −50 %'):'')+(c.bill.type!=='kus'&&!xPrice(c)?chip('chybi','doplň cenu příspěvku navíc'):'')+(ref?chip('napad','Doporučil '+ref.name):'')}
function vKlienti(){
  const cs=clients(),c=cs.find(x=>x.id===cid)||cs[0],p=plan(c),[cl,,lab]=lvl(p.weeksLeft);
  const sw='<div class="pill-tabs" role="tablist">'+cs.map(x=>'<button role="tab" aria-selected="'+(x.id===c.id)+'" data-cl="'+x.id+'">'+esc(x.name)+'</button>').join('')+'</div>';
  const head='<div class="card"><div class="chead">'+avatar(c)+'<div><h2>'+esc(c.name)+'</h2><p class="t2">'+esc(c.role)+'</p><p class="small" style="margin-top:10px">'+esc(c.scope)+'</p>'+(c.profiles?'<div class="profs nl" style="justify-content:flex-start">'+c.profiles.map(p=>safeUrl(p.url)?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+netIco(p.k)+''+esc(p.name)+'</a>':'').join('')+'</div>':'<p class="t2">'+esc(c.nets.join(' · '))+'</p>')+'</div><div class="act"><span class="chip '+(c.verify!=='manual'?'c-vydano':'c-natoceno')+'">'+(c.verify==='metricool'?'Vydání hlídá Metricool':c.verify==='instagram'?'Vydání hlídám na sítích':'Kontrola vydání ručně')+'</span>'+headBonus(c)+(c.strategy?(safeUrl(c.zoneUrl)?'<a class="btn sm" href="'+esc(c.zoneUrl)+'" target="_blank" rel="noopener">Strategie '+ds(pd(c.strategy.date))+'</a>':chip('vydano','Strategie '+ds(pd(c.strategy.date)))):chip('chybi','Chybí strategie'))+'<button class="btn sm" data-go="zona-'+c.id+'">Zóna klienta</button></div></div>'+
   '<div class="row between" style="margin-top:18px"><span class="small"><b>'+tydn(p.weeksLeft)+'</b> <span class="muted">materiálu · '+p.ready.length+' videí · '+lab.toLowerCase()+'</span></span><span class="small muted">poslední natáčení '+ds(pd(c.lastShoot))+'</span></div><div class="bar" style="margin-top:8px"><i class="'+cl+'" style="width:'+Math.min(100,p.weeksLeft/8*100)+'%"></i></div></div>';
  const tabs=[['plan','Plán'],['zasobnik','Zásobník'],['vydano','Vydáno'],['faktura','Faktura']];
  let body='';
  if(ctab==='plan')body=p.weeks.map(w=>w.rows.length?'<div class="wk"><h3>'+ds(w.ws)+'–'+ds(w.we)+(+w.ws===+monday(TODAY)?' · tento týden':'')+'</h3>'+w.rows.map(r=>'<div class="prow"><div class="pd">'+DN[r.date.getDay()]+' '+ds(r.date)+'</div><div><b class="small">'+esc(r.it?r.it.t:r.kind==='gap'?'Chybí natočené video':r.label)+'</b><div class="t2">'+esc(r.kind==='ai'?'bez natáčení, z materiálu nebo AI':r.kind==='bonus'?'bonus za doporučení · nefakturuje se':r.label)+'</div></div>'+(r.kind==='done'?chip(r.it.bonus?'bonus':'vydano',r.it.bonus?'Bonus · vyšlo':'Vydáno'):r.kind==='gap'?chip('chybi','Natočit'):r.kind==='ai'?chip('ai','Bez natáčení'):r.kind==='bonus'?chip('bonus','Bonus'):chip(r.it.s,SL[r.it.s]))+'</div>').join('')+'</div>':'').join('')+'<p class="hint" style="margin-top:16px">Plán se skládá sám: hotová videa ze zásobníku se řadí do volných termínů. Kde materiál dojde, ukáže se „Natočit“.</p>';
  if(ctab==='zasobnik'){const g=[['zpracovano','Zpracováno, připraveno k vydání'],['natoceno','Natočeno, čeká na střih'],['napad','Nápady']];body=g.map(([s,t])=>{const its=c.items.filter(i=>i.s===s);return its.length?'<div class="wk"><h3>'+t+' · '+its.length+'</h3><ul class="list">'+its.map(i=>'<li><div class="grow"><b class="small">'+esc(i.t)+'</b>'+(i.new?' '+chip('zpracovano','Nové'):'')+'<div class="t2">'+esc(i.ty)+(i.file?' · '+esc(i.file):'')+(i.caption===false?' · chybí popisek':'')+'</div></div>'+stSel(i)+'</li>').join('')+'</ul></div>':''}).join('')+'<form class="row" id="addf" style="margin-top:18px"><input id="addT" placeholder="Nový natočený materiál" style="flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:44px;font-size:16px"><button class="btn pri">Přidat</button></form>'}
  if(ctab==='vydano'){const its=c.items.filter(i=>i.s==='vydano').sort((a,b)=>(b.date||'').localeCompare(a.date||''));body='<ul class="list">'+its.map(i=>{const u=safeUrl(i.url);return'<li><div class="pd small nowrap" style="width:62px;font-weight:600">'+(i.date?ds(pd(i.date)):'<span class="muted tiny">'+esc(i.week||'')+'</span>')+'</div><div class="grow"><b class="small">'+esc(i.t)+'</b><div class="t2">'+esc(i.ty)+(i.fixed?' · opraveno kontrolou':'')+'</div>'+(i.links?'<div class="nlw">'+netLinks(i,c)+'</div>':'')+'</div>'+(i.links?'':netLinks(i,c))+billSel(i,c)+stSel(i)+'</li>'}).join('')+'</ul>'+'<p class="hint" style="margin-top:14px">'+(c.bill.type==='kus'?'U každého videa vybereš, jestli se fakturuje (komplet reel, edit), je to rozšíření spolupráce, bonus za doporučení, nebo se nefakturuje vůbec.':'U každého příspěvku vybereš, jestli je v paušálu, je to rozšíření spolupráce (fakturuje se navíc), nebo bonus za doporučení.')+'</p>'}
  if(ctab==='faktura')body=invBlock(c);
  return'<div class="head"><div><h1>Klienti</h1><p class="sub">Plán, zásobník a co vyšlo. Stav změníš kliknutím.</p></div></div>'+sw+head+'<div class="card" style="margin-top:20px"><div class="pill-tabs" role="tablist">'+tabs.map(([k,l])=>'<button role="tab" aria-selected="'+(ctab===k)+'" data-ctab="'+k+'">'+l+'</button>').join('')+'</div>'+body+'</div>'}

function invBlock(c){const st=invState(c),its=invItems(c),sum=invSum(c),ppc=prepaid(c),pre=its.find(i=>i.pre);
  const amt=c.bill.type==='pausal'?'<div class="field" style="max-width:320px"><label for="amt">Měsíční paušál (Kč)</label><input id="amt" data-cl="'+c.id+'" inputmode="numeric" placeholder="Doplň částku" value="'+esc(c.bill.amount??'')+'"></div>':'<p class="small">Účtováno za kus: komplet reel 750 Kč, střih z předtočeného 500 Kč. Sčítají se placená videa, která vyšla v '+inMonth(invMN())+'. Bonusové příspěvky se nefakturují.</p>'+(c.items.some(i=>i.extra&&i.date&&i.date.slice(0,7)===INVM())?'<p class="small" style="margin-top:8px;color:var(--warn)">Mimo pořadník vyšlo: '+esc(c.items.filter(i=>i.extra&&i.date&&i.date.slice(0,7)===INVM()).map(i=>i.t).join(', '))+'. Pokud jsou od tebe, přepni je ve Vydáno na Komplet reel nebo Edit.</p>':'');
  return amt+'<div class="row between" style="margin-top:18px"><div><div class="t2">Faktura '+invNo(c)+' · '+invMonthName()+'</div><div style="font-size:28px;font-weight:700;letter-spacing:-.03em">'+(sum?kc(sum):ppc&&pre?'0 Kč':'–')+'</div>'+(pre?'<div class="t2">'+kc(-pre.p)+' strženo ze zálohy</div>':'')+'</div><div class="row">'+(sum?'<button class="btn" data-inv="'+c.id+'">Náhled</button>':'')+(st.approved?chip('vydano',st.paid?'Zaplaceno':'Schváleno'):sum?(RO?chip('napad','Čeká na schválení'):'<button class="btn pri" data-approve="'+c.id+'">Schválit</button>'):'')+'</div></div><p class="hint" style="margin-top:10px">'+(ppc&&!sum?'Celé je to kryté zálohou, nic se nevystavuje.':'Schválená faktura se '+ds(issueD(c))+' objeví v zóně klienta i s QR platbou a odejde mu odkaz mailem.')+'</p>'+ppCard(c,true)}

function vNatoceni(){const sp=shootPlan(),by=new Map(sp.map(s=>[iso(s.date),s])),days=[];
  for(let d=add(TODAY,1);days.length<16;d=add(d,1))if(d.getDay()===1||d.getDay()===4||by.has(iso(d)))days.push(d);
  return'<div class="head"><div><h1>Natáčení</h1><p class="sub">'+esc(clients().map(c=>{const sd=c.shootDays||{main:[1,4]},W=['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];return c.name.split(' ').slice(-1)[0]+' '+(sd.main||[]).map(d=>W[d%7]).join(' nebo ')+(sd.pref!=null&&(sd.main||[]).length>1?' (hlavně '+W[sd.pref%7]+')':'')+(sd.alt&&sd.alt.length?', když nejde, tak víkend':'')}).join('. '))+'. Nikdy dva klienti v jeden den, dny obsazené v kalendáři přeskakuju.</p></div></div><div class="grid"><div class="card"><div class="ch"><h2>Příštích 8 týdnů</h2></div>'+days.map(d=>{const s=by.get(iso(d)),bz=busyNote(d);if(!s)return'<div class="frow"><b>'+DN[d.getDay()]+' '+ds(d)+'</b>'+(bz?'<span class="busy">'+esc(bz)+'</span>':'volno')+'</div>';return'<div class="shoot"><div class="cal"><span>'+DN[d.getDay()]+'</span><b>'+d.getDate()+'</b><i>'+MG[d.getMonth()].slice(0,3)+'</i></div><div><b>'+esc(s.c.name)+'</b><div class="t2">'+(s.status==='ok'?'domluveno'+(s.note?' · '+esc(s.note):'')+calNote(s):'návrh · materiál dojde '+ds(s.p.gap)+(s.alt?' · víkend, čtvrtky jsou obsazené':'')+(s.late?' · už je pozdě, natoč co nejdřív':''))+' · aspoň '+s.c.filmPW*4+' videí</div></div>'+(RO?(s.status==='ok'?chip('vydano','Domluveno'):chip('natoceno','Návrh')):s.status==='ok'?'<button class="btn sm" data-del-shoot="'+iso(d)+'">Zrušit</button>':'<button class="btn sm soft" data-ok-shoot="'+s.c.id+'|'+iso(d)+'">Potvrdit</button>')+'</div>'}).join('')+'<p class="hint" style="margin-top:14px">Po potvrzení ho při nejbližší kontrole (6:47 nebo 18:47) zapíšu do Apple Kalendáře.</p></div>'+
  '<form class="card" id="shf"><h2>Domluvit natáčení</h2><div class="field"><label for="shC">Klient</label><select id="shC">'+clients().map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label for="shD">Datum</label><input type="date" id="shD" min="'+iso(TODAY)+'" value="'+iso(sp[0]?sp[0].date:add(TODAY,7))+'"></div><div class="field"><label for="shN">Poznámka</label><input id="shN" placeholder="Místo, scénáře, co vzít"></div><button class="btn pri" style="margin-top:18px;width:100%;justify-content:center">Uložit termín</button><p class="hint" style="margin-top:10px">Domluvený termín má přednost před návrhem a appka ho respektuje i mimo běžné dny. Do Apple Kalendáře se zapíše při další kontrole.</p></form></div>'}

function vFaktury(){const cs=clients();return'<div class="head"><div><h1>Faktury</h1><p class="sub">Vlastní faktury s QR platbou za '+invMonthName()+', splatnost '+(+owner().due||14)+' dní. Každý klient má svůj den vystavení.</p></div></div><div class="card scroll"><table class="mtable"><thead><tr><th>Klient</th><th>Číslo</th><th class="r">Částka</th><th>Vystavení</th><th>Splatnost</th><th>Stav</th><th></th></tr></thead><tbody>'+cs.map(c=>{const s=invState(c),sum=invSum(c),pp=prepaid(c);return'<tr><td data-l="Klient"><b>'+esc(c.name)+'</b>'+(pp?'<div class="t2">záloha: zbývá '+kc(pp.left)+(pp.first?' · nová faktura do '+ds(add(pp.first,-(+owner().due||14))):'')+'</div>':'')+'</td><td data-l="Číslo" class="num">'+invNo(c)+'</td><td data-l="Částka" class="r num">'+(sum?kc(sum):pp?'0 Kč':'<button class="btn sm soft" data-cl="'+c.id+'" data-goinv="1">Doplnit cenu</button>')+'</td><td data-l="Vystavení" class="nowrap">'+(pp&&!sum?'–':dsy(issueD(c)))+'</td><td data-l="Splatnost" class="nowrap">'+(pp&&!sum?'–':dsy(dueD(c)))+'</td><td data-l="Stav">'+(pp&&!sum?chip('vydano','Kryto zálohou'):s.paid?chip('vydano','Zaplaceno'):s.approved?(RO?chip('zpracovano','Schváleno'):'<button class="btn sm" data-paid="'+c.id+'">Označit zaplaceno</button>'):chip('napad','Koncept'))+'</td><td>'+(sum?'<button class="btn sm" data-inv="'+c.id+'">Náhled</button>':'')+'</td></tr>'}).join('')+'</tbody></table></div>'+bonusCard()+(!iban(owner().acc)||!owner().ico?'<div class="card flat" style="margin-top:20px"><b>Chybí IČO nebo číslo účtu.</b> <span class="muted">Bez nich nejde vystavit platnou fakturu ani QR platbu.</span> <button class="btn sm soft" data-go="nastaveni" style="margin-left:6px">Doplnit</button></div>':'')}

const appUrl=()=>{const w=D.webAdmin;return w&&/^[a-z0-9-]+$/.test(w.slug||'')&&/^[A-Za-z0-9_-]{40,}$/.test(w.key||'')?'https://klienti.sebastiancakl.cz/'+w.slug+'/#'+w.key:''};

function vNastaveni(){const o=owner(),ib=iban(o.acc),n=E.notif||{},tg=(k,l,d,def=true)=>'<div class="tog"><div><b class="small">'+l+'</b><div class="t2">'+d+'</div></div><input type="checkbox" class="sw" data-n="'+k+'" '+((n[k]??def)?'checked':'')+' aria-label="'+l+'"></div>';

function calSection(c,p,sh){const ev=calEvents(c,p,sh),by={};ev.forEach((e,ix)=>{e.ix=ix;(by[e.d]=by[e.d]||[]).push(e)});CALEV[c.id]=ev;

function vZona(id){const c=C(id);if(!c)return'<p>Klient nenalezen.</p>';const p=plan(c,3),st=c.stats,inv=invState(c),admin=D.mode!=='client';

function drawChart(){const s=document.getElementById('chart');if(!s)return;const c=C(s.dataset.c);if(!c||!c.stats||!c.stats.daily)return;const st=c.stats,W=s.clientWidth,H=s.clientHeight;if(!W)return;
  const cum=a=>{let t=0;return a.map(v=>t+=v)},cur=cum(st.daily.cur),prv=cum(st.daily.prev),n=31,narrow=W<520;
  const m={l:narrow?40:56,r:narrow?12:96,t:18,b:28},pw=W-m.l-m.r,ph=H-m.t-m.b,mx=Math.max(cur[cur.length-1],prv[prv.length-1]);
  const step=mx>400000?200000:mx>150000?100000:50000,top=Math.ceil(mx/step)*step;
  const X=i=>m.l+i/(n-1)*pw,Y=v=>m.t+ph-v/top*ph,lab=v=>v>=1e6?wfmt(v/1e6)+' mil.':v?fmt(v/1000)+(narrow?'k':' tis.'):'0';
  let g='';for(let v=0;v<=top;v+=step)g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(m.l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="12" fill="var(--mute)">'+lab(v)+'</text>';
  [1,8,15,22,29].forEach(d=>{g+='<text x="'+X(d-1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="12" fill="var(--mute)">'+d+'.</text>'});
  const path=a=>a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
  g+='<path d="'+path(cur)+'L'+X(cur.length-1)+' '+Y(0)+'L'+X(0)+' '+Y(0)+'Z" fill="var(--mark)" opacity=".1"/>';
  g+='<path d="'+path(prv)+'" fill="none" stroke="var(--faint)" stroke-width="2" stroke-dasharray="5 5"/>';
  g+='<path d="'+path(cur)+'" fill="none" stroke="var(--mark)" stroke-width="2.5" stroke-linejoin="round"/>';
  const li=cur.length-1;g+='<circle cx="'+X(li)+'" cy="'+Y(cur[li])+'" r="5" fill="var(--mark)" stroke="var(--card)" stroke-width="2"/>';
  if(!narrow){g+='<text x="'+(X(li)+10)+'" y="'+(Y(cur[li])+4)+'" font-size="13" font-weight="600" fill="var(--ink)">'+lab(cur[li])+'</text><text x="'+(X(n-1)+8)+'" y="'+(Y(prv[n-1])+4)+'" font-size="13" fill="var(--mute)">'+esc(st.prevName)+' '+lab(prv[n-1])+'</text>'}
  g+='<line id="xh" x1="0" x2="0" y1="'+m.t+'" y2="'+(m.t+ph)+'" stroke="var(--mute)" stroke-width="1" opacity="0"/>';
  s.innerHTML=g;const tip=document.getElementById('tip'),xh=s.querySelector('#xh');
  s.onpointermove=e=>{const r=s.getBoundingClientRect();let i=Math.round((e.clientX-r.left-m.l)/pw*(n-1));if(i<0||i>=n){tip.style.opacity=0;xh.setAttribute('opacity',0);return}
    tip.innerHTML='<b>'+(i+1)+'. den</b><br>'+esc(st.monthName)+' '+(i<cur.length?fmt(cur[i]):'–')+'<br>'+esc(st.prevName)+' '+fmt(prv[i]);tip.style.opacity=1;xh.setAttribute('x1',X(i));xh.setAttribute('x2',X(i));xh.setAttribute('opacity',.4);
    tip.style.left=Math.min(W-tip.offsetWidth,Math.max(0,X(i)-tip.offsetWidth/2))+'px'};
  s.onpointerleave=()=>{tip.style.opacity=0;xh.setAttribute('opacity',0)}}
const ro=new ResizeObserver(()=>drawChart());

  if(d.ctab){ctab=d.ctab;render();return}
  if(d.pub){setItem(d.pub,{s:'vydano',date:iso(TODAY)});toast('Označeno jako vydané.');return}
  if(d.okShoot){const[c,dt]=d.okShoot.split('|');E.shoots=(E.shoots||[]).filter(s=>s.c!==c||pd(s.date)<TODAY);E.shoots.push({c,date:dt,u:stamp()});persist();render();toast('Potvrzeno. Do Apple Kalendáře ho zapíšu při další kontrole.');return}
  if(d.delShoot){E.shoots=(E.shoots||[]).filter(s=>s.date!==d.delShoot);persist();render();return}
  if(d.refEnd){E.ref=E.ref||{};E.ref[d.refEnd]={...(E.ref[d.refEnd]||{}),end:iso(TODAY),u:stamp()};persist();render();toast('Ukončeno. Bonus běží do konce měsíce.');return}
  if(d.refUndo){E.ref=E.ref||{};E.ref[d.refUndo]={...(E.ref[d.refUndo]||{}),end:'',u:stamp()};persist();render();return}
  if(d.discDel!=null){E.disc=(E.disc||[]).filter((x,i)=>i!==+d.discDel);persist();render();return}
  if(d.dlStrat){const c=D.clients[0],st=c.strategy;(async()=>{try{const b=await(await fetch(st.file)).blob();await DL.save({filename:'Strategie_'+c.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'_')+'.pdf',data:b})}catch(err){if(!err||err.code!=='declined')toast('Stažení nešlo, otevři PDF tlačítkem vedle.')}})();return}
  if(d.calm){const[id,m]=d.calm.split('|');CAL[id]=m;hidePop();render();return}
  if(d.cald){const[id,k]=d.cald.split('|');CALD[id]=k;render();return}
  if(d.ev){const[id,ix]=d.ev.split('|'),e=(CALEV[id]||[])[+ix];if(!e)return;hidePop();const sh=document.getElementById('sheet');sh.className='sheet sm';sh.innerHTML=evCard(C(id),e,true);document.getElementById('ov').classList.add('on');return}
  if(d.inv){document.getElementById('sheet').className='sheet';document.getElementById('sheet').innerHTML=invoice(C(d.inv));document.getElementById('ov').classList.add('on');return}
  if(d.approve){E.inv=E.inv||{};const k=invKey(C(d.approve));E.inv[k]={...(E.inv[k]||{}),approved:true,u:stamp()};persist();render();toast('Schváleno. Klient ji uvidí po nejbližší kontrole.');return}
  if(d.paid){E.inv=E.inv||{};const k=invKey(C(d.paid));E.inv[k]={...(E.inv[k]||{}),paid:true,u:stamp()};persist();render();toast('Označeno jako zaplacené.');return}
});
const POP=document.getElementById('pop');let popT=null,popB=null;
function hidePop(){clearTimeout(popT);POP.classList.remove('on');if(popB)popB.classList.remove('hov');popB=null}
function showPop(b){const[id,ix]=b.dataset.ev.split('|'),e=(CALEV[id]||[])[+ix];if(!e)return;if(popB!==b){if(popB)popB.classList.remove('hov');POP.innerHTML=evCard(C(id),e,false)}popB=b;b.classList.add('hov');
  const r=b.getBoundingClientRect(),W=POP.offsetWidth||372,H=POP.offsetHeight||260,vw=innerWidth,vh=innerHeight;let x=r.right+10;if(x+W>vw-12)x=r.left-W-10;if(x<12)x=Math.max(12,Math.min(vw-W-12,r.left));let yy=r.top-12;if(yy+H>vh-12)yy=vh-H-12;if(yy<12)yy=12;POP.style.left=x+'px';POP.style.top=yy+'px';POP.classList.add('on')}
const canHover=()=>matchMedia('(hover:hover) and (min-width:701px)').matches;
document.addEventListener('mouseover',e=>{const b=e.target.closest&&e.target.closest('.ke');if(b&&canHover()){clearTimeout(popT);showPop(b);return}if(e.target.closest&&e.target.closest('#pop'))clearTimeout(popT)});
document.addEventListener('mouseout',e=>{if(!(e.target.closest&&e.target.closest('.ke,#pop')))return;const to=e.relatedTarget;if(to&&to.closest&&to.closest('.ke,#pop'))return;clearTimeout(popT);popT=setTimeout(hidePop,160)});
window.addEventListener('scroll',()=>{if(POP.classList.contains('on'))hidePop()},{passive:true});
let splashT0=performance.now();function splashOff(){const sp=document.getElementById('splash');if(!sp||sp.classList.contains('done'))return;setTimeout(()=>{sp.classList.add('done');setTimeout(()=>sp.remove(),600)},Math.max(0,900-(performance.now()-splashT0)))}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')e.currentTarget.classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('ov').classList.remove('on')});
document.addEventListener('change',e=>{const t=e.target;if(RO){render();roNote();return}
  if(t.dataset.st){setItem(t.dataset.st,{s:t.value,...(t.value==='vydano'?{date:iso(TODAY)}:{})});toast('Uloženo.');return}
  if(t.dataset.bill){setItem(t.dataset.bill,{bill:t.value});toast('Uloženo.');return}
  if(t.dataset.n){E.notif=E.notif||{};E.notif[t.dataset.n]=t.checked;persist();return}
  if(t.id==='amt'){E.bill=E.bill||{};const v=+t.value.replace(/\D/g,'')||null;E.bill[t.dataset.cl]={amount:v,u:stamp()};persist();render();return}});
document.addEventListener('input',e=>{if(RO)return;const t=e.target,map={sName:'name',sAddr:'addr',sIco:'ico',sAcc:'acc',sDue:'due'};if(map[t.id]){E.set=E.set||{};E.set[map[t.id]]=t.value;persist();if(t.id==='sAcc'){const ib=iban(t.value);document.getElementById('ibOut').textContent=ib?'IBAN '+ib.replace(/(.{4})(?!$)/g,'$1 '):'Formát: předčíslí-číslo/kód banky, např. 19-123457/0800.'}}});
document.addEventListener('submit',e=>{e.preventDefault();if(RO){roNote();return}const f=e.target;
  if(f.id==='addf'){const v=document.getElementById('addT').value.trim();if(!v)return;E.added=E.added||[];E.added.push({id:'a'+Date.now().toString(36),c:cid,t:v,ty:'Video',s:'natoceno',film:true,u:stamp()});persist();render();toast('Přidáno do zásobníku.')}
  if(f.id==='xpf'){E.xprice=E.xprice||{};f.querySelectorAll('[data-xp]').forEach(x=>{const v=x.value.replace(/\D/g,'');E.xprice[x.dataset.xp]=v?+v:''});persist();render();toast('Ceny uložené.');return}
  if(f.id==='reff'){const by=document.getElementById('rfBy').value,to=document.getElementById('rfTo').value;if(by===to){toast('Klient nemůže doporučit sám sebe.');return}E.ref=E.ref||{};E.ref[to]={by,since:document.getElementById('rfSince').value||'',end:'',u:stamp()};persist();render();toast('Doporučení uloženo.');return}
  if(f.id==='discf'){const c=document.getElementById('dcC').value,t=document.getElementById('dcT').value.trim(),a=+document.getElementById('dcA').value.replace(/\D/g,'');if(!t||!a)return;E.disc=E.disc||[];E.disc.push({c,t,amount:a,month:INVM(),u:stamp()});persist();render();toast('Sleva je na faktuře.');return}
  if(f.id==='shf'){const c=document.getElementById('shC').value,dt=document.getElementById('shD').value;if(!dt)return;E.shoots=(E.shoots||[]).filter(s=>s.c!==c||pd(s.date)<TODAY);E.shoots.push({c,date:dt,note:document.getElementById('shN').value.trim(),u:stamp()});persist();render();toast('Termín uložen.')}});
function route(){const h=location.hash.slice(1);if(/^(prehled|klienti|natoceni|faktury|nastaveni|zona-[a-z]+)$/.test(h))view=h;render()}
window.addEventListener('hashchange',route);
if(location.hostname==='app.test')window.__t={get D(){return D},get E(){return E},C,prepaid,invItems,invSum,issueD,dueD,clients};
function setToday(){const real=new Date(),t=new Date(real.getFullYear(),real.getMonth(),real.getDate());TODAY=t<pd(D.today)?pd(D.today):t}
function webEdits(){if(D&&D._edits&&typeof D._edits==='object'){E={items:{},added:[],shoots:[],set:{},bill:{},inv:{},notif:{},...D._edits};syncMode='web'}}
let webAt=Date.now();document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||!window.webLoad||!D||Date.now()-webAt<60000)return;webAt=Date.now();window.webLoad().then(j=>{if(j&&j.clients){D=j;setToday();webEdits();render()}}).catch(()=>{})});
async function initDb(){try{if(!window.claude||!window.claude.use||D.mode==='client')return;const db=null;if(!db)return;ref=db.doc('crm/edits');const tm=setTimeout(()=>{syncMode='local';render()},10000);
  ref.onSnapshot(s=>{clearTimeout(tm);if(s.exists){const x=JSON.parse(JSON.stringify(s.data()));E={items:{},added:[],shoots:[],set:{},bill:{},inv:{},notif:{},...x}}syncMode='db';render()},()=>{clearTimeout(tm);syncMode='local';render()})}catch(e){}}
webLoad().then(j=>{D=j;setToday();webEdits();route();splashOff();initDb();if(D.mode==='client'&&D.clients[0].strategy&&window.claude&&window.claude.use)window.claude.use('downloads').then(x=>{if(x){DL=x;render()}}).catch(()=>{})}).catch(err=>{splashOff();document.getElementById('root').innerHTML=webFail(err)});
}
